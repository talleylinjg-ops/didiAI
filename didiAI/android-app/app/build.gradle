plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chacha.didiai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chacha.didiai'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'didi-ai-2026'
            keyAlias 'didi-ai'
            keyPassword 'didi-ai-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
